<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcommBuddy - Coming Soon</title>
    <style>
        /* CSS Styles */
        body {
            /* Flexbox to center everything perfectly */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            margin: 0;
            
            /* Off-white background color */
            background-color: #fcfbf9; 
            
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            color: #2c3e50;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .contact-container {
            margin-top: 20px;
            padding: 15px 25px;
            border-top: 1px solid #e0e0e0;
        }

        .contact-text {
            font-size: 1rem;
            color: #555;
        }

        .contact-link {
            color: #333;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .contact-link:hover {
            color: #000;
            text-decoration: underline;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
                padding: 0 15px;
            }
            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <h1>Jai Shree Krishna</h1>

    <div class="subtitle">Launching Soon</div>

    <div class="contact-container">
        <p class="contact-text">
            Contact: <a href="mailto:harshit@ecommbuddy.in" class="contact-link">harshit@ecommbuddy.in</a>
        </p>
    </div>

</body>
</html>
